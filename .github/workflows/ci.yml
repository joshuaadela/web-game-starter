name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Multiplayer smoke test
        run: |
          PORT=2599 npx tsx server/src/index.ts > server.log 2>&1 &
          for i in $(seq 1 30); do grep -q "listening" server.log && break; sleep 1; done
          npm run smoke -- ws://localhost:2599
      - name: Server log
        if: failure()
        run: cat server.log || true
